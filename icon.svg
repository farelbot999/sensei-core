<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0d0d0f"/>
  <rect x="40" y="40" width="432" height="432" rx="60" fill="#141416" stroke="#c9a84c" stroke-width="4"/>
  
  <!-- Hexagon shield -->
  <polygon points="256,80 340,128 340,224 256,272 172,224 172,128" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Ninja mask emoji-style face -->
  <circle cx="256" cy="176" r="56" fill="#1c1c20" stroke="#b87333" stroke-width="5"/>
  <!-- Eyes -->
  <ellipse cx="238" cy="170" rx="10" ry="8" fill="#c9a84c"/>
  <ellipse cx="274" cy="170" rx="10" ry="8" fill="#c9a84c"/>
  <!-- Eye shine -->
  <circle cx="243" cy="167" r="3" fill="#0d0d0f"/>
  <circle cx="279" cy="167" r="3" fill="#0d0d0f"/>
  <!-- Mask bottom -->
  <rect x="215" y="185" width="82" height="30" rx="8" fill="#b87333"/>
  
  <!-- Circuit lines bottom -->
  <line x1="256" y1="290" x2="256" y2="340" stroke="#c9a84c" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="340" x2="310" y2="340" stroke="#c9a84c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="340" r="6" fill="#c9a84c"/>
  <circle cx="256" cy="340" r="6" fill="#c9a84c"/>
  <circle cx="310" cy="340" r="6" fill="#c9a84c"/>
  
  <!-- SENSEI text -->
  <text x="256" y="420" font-family="monospace" font-size="38" font-weight="900" fill="#c9a84c" text-anchor="middle" letter-spacing="6">SENSEI</text>
  <text x="256" y="450" font-family="monospace" font-size="18" fill="#8a8070" text-anchor="middle" letter-spacing="4">CORE</text>
</svg>
